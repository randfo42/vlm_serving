<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>trailwalk — 판정 지도</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <strong>trailwalk</strong>
  <label>프롬프트 <select id="version"></select></label>
  <span id="stat"></span>
  <span id="banner" hidden></span>
  <span id="legend">
    녹지 <i style="background:#d03b3b"></i>0 <i style="background:#d1b93c"></i>1
    <i style="background:#7fbf3f"></i>2 <i style="background:#0ca30c"></i>3
    · <i class="ring"></i> 사람 라벨
  </span>
</header>
<div id="map"></div>
<div id="tooltip" hidden></div>
<aside id="panel" hidden>
  <button id="panel-close" title="닫기">×</button>
  <div id="panel-body"></div>
</aside>
<div id="jobs" hidden>
  <div id="jobs-head">탐색 잡 <span class="muted">(지도 우클릭 = 여기서 탐색)</span></div>
  <div id="jobs-list"></div>
</div>
<div id="fatal" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
