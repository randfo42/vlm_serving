# 약수역 반경 1km explore — VLM 판정까지 붙은 실제 탐색 런
#
#     python app/run_explore.py --config app/config/yaksu-1km-explore.yaml
#
# ⚠️ **VLM 서버가 필요하다.** 캡처만 모으는 run_collect 와 다르다.
# 여기 없는 값은 전부 정본(app/config/trailwalk.yaml)에서 온다.
#
# ⚠️ **서버 주소가 여기 없다.** 정본의 `vlm.url` 은 로컬(127.0.0.1:8080)이다.
# 원격 서버로 돌리려면 이 파일을 복사해 `vlm.url` 을 더한 사본을 **레포 밖에**
# 두고 그것을 --config 로 준다 — 이 저장소는 공개라 LAN IP 를 넣지 않는다.
# (설정 병합은 정본 + 파일 하나라 사본에 이 파일 내용이 전부 들어가야 한다.)
#
# 2026-08-24. 지금까지 약수·청계천에서 한 것은 전부 캡처 수집이었고
# (run_collect), 판정은 그 파일들에 사후로 때렸다. 이건 explore 가 캡처와
# 판정을 겹쳐 돌리는 실제 경로를 반경 1km 규모로 돌려 보는 런이다.

run:
  provider: kakao          # 실제 로드뷰. fixture 로는 의미가 없다

  # 약수역사거리 — yaksu-collect.yaml 과 **같은 시작점**이다. 그래야
  # yaksu-1000(반경 500m 캡처 세트)과 겹치는 구간을 비교할 수 있다
  start: [37.5547937, 127.0106427]

  # 시작 노드는 이웃을 전부 물으므로 이 값은 어느 쪽을 먼저 볼지만 정한다
  bearing: 0.0

  # 6시간짜리 런이라 중간에 죽어도 어디까지 갔는지 남아야 한다.
  # 런로그는 줄마다 flush 되므로 도는 중에도 읽을 수 있다
  out: "app/runs/yaksu-1km-explore.jsonl"

  # 지도(eval/plot_explore.py)의 입력. 끝나야 써지므로 런로그와 역할이 다르다
  dump: "app/runs/yaksu-1km-explore.dump.json"

budget:
  # 사용자 요청: 반경 1km
  max_distance_m: 1000.0

  # 사용자 요청: 6시간. 반경이 먼저 걸리는 것이 정상이고 이건 안전망이다.
  #
  # 다 돌 수 있나: 반경 500m 를 전부 캡처하면 2,422장/91분이었다(청계천 GS25,
  # 2026-08-23). 1km 는 면적이 4배지만 skip 이 노드 비용을 2.07s → 0.49s 로
  # 낮추므로(아래) 6시간 안에 들어올 가능성이 있다. 못 들어오면 stop 이
  # time_budget 으로 남아 무엇이 끊었는지 보인다 — 그게 예산 축이 둘뿐인 이유다
  max_seconds: 21600.0

# skip 은 정본 그대로 쓴다: run_steps 1 / skip_steps 4 = **5개 중 4개 건너뛴다.**
# 건너뛴 노드도 이웃은 묻고 확장하므로 그래프 모양은 그대로고, 빠지는 것은
# 캡처와 판정뿐이다. 갈림길은 주기와 무관하게 전부 찍는다.
#
# ⚠️ 대가는 지면 커버리지다 — 표본 간격이 ~50m 가 되어 안 본 지면이 생긴다.
# 이 런은 대략적 마킹·커버리지 조사용이지 정확도를 재는 런이 아니다
# (정확도를 재려면 skip_steps: 0 → 정본 주석 참고).
