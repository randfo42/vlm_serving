# trailwalk 설정 — app/ 의 기본값은 전부 여기 하나에 있다.
#
# 규칙 (→ CLAUDE.md):
#
#   1. 기본값을 코드에 적지 않는다. dataclass 필드도, 모듈 상수도,
#      argparse 의 default= 도 아니다. 전부 이 파일이다.
#   2. CLI 는 `--config <경로>` 하나만 받는다. 런을 재현하려면 이 파일
#      하나만 있으면 된다.
#   3. 값 옆에 **왜 그 값인가**를 적는다. 근거를 못 적겠으면 그건
#      정해진 값이 아니라 아직 안 정한 값이다 — 그렇게 적어 둔다.
#
# 왜 모았나: 같은 개념이 dataclass·CLI·모듈 상수 세 곳에 흩어져 있었고,
# 값이 서로 어긋났다 (max_candidates 가 walk 3 / explore 4, max_turn_deg 가
# walk 120 / explore 180, expand_non_trail 은 CLI 로 되돌릴 수단이 아예 없었다).
# 어느 것이 실제로 먹는 값인지 코드를 다 읽어야 알 수 있는 상태였다.

# ── 이 런이 무엇인가 ───────────────────────────────────────────────────────
run:
  # kakao = Playwright 로 실제 로드뷰를 몬다 (앱키·브라우저 필요)
  # fixture = 로컬 이미지 + 10m 격자. 오프라인 배선 검증과 회귀 테스트용
  provider: fixture

  # 탐색 시작 좌표 [위도, 경도]. 이 값만 pano 로 스냅되고, 이후 이동은
  # 전부 이웃 그래프다 (좌표를 밀어 만드는 자리는 없다)
  start: [37.5697109, 127.0063616]   # 청계천 보행로

  # 시작 방위 (0=북). 시작 노드는 이웃을 **전부** 물으므로 이 값은
  # 어느 쪽을 먼저 물을지(정렬)만 정한다. 예산이 모자랄 때만 결과가 갈린다
  bearing: 0.0

  # null 이면 app/runs/<UTC시각>-<provider>[-explore].jsonl
  out: null

  # (explore 전용) nodes/probes/frontier 를 JSON 으로 덤프할 경로.
  # eval/plot_explore.py 의 입력이다. null 이면 안 쓴다
  dump: null

  # probe 이미지를 남겨 판정을 눈으로 감사한다. 기본이 꺼진 이유는 성능이
  # 아니라 지도 사업자 약관상 이미지 캐싱이 회색지대이기 때문이다
  save_images: false

  # 브라우저를 띄워서 본다. 캡처가 검게 나오면 첫 번째 의심 대상이다
  headed: false

  # 콜드 스타트(유휴 뒤 첫 요청 ~12초)를 측정 밖으로 빼는 사전 1회 호출
  warmup: false

# ── 예산 ───────────────────────────────────────────────────────────────────
#
# 실질 상한은 **VLM 호출 수**다. 지갑에서 나가는 것은 걸음도 depth 도 아니고
# 호출(~2.2s/건)이다. 같은 걸음 수라도 갈림길이 많으면 호출이 몇 배가 된다.
# walk 는 원래 max_steps 만 셌는데, 그러면 두 루프의 예산을 비교할 수 없었다.
budget:
  max_vlm_calls: 60

  # 벽시계(초). VLM 호출뿐 아니라 **캡처 대기까지** 포함한 안전망이다.
  # 캡처 1건 최악이 ~6.4초(타일 5s + 프레임 안정화 1.44s)라 여기가 커진다.
  #
  # 산술: explore 는 60호출 × 2.2s ≈ 132s 라 이 값에 안 걸린다 — 캡처가
  # 병적으로 느릴 때만 걸리는 안전망이다. walk 는 걸릴 수 있다.
  max_seconds: 900.0

  # 의미적 한계 — "몇 걸음까지 볼 것인가". 비용 상한이 아니다.
  walk_max_steps: 120       # walk: 한 길을 몇 칸까지 따라갈지
  explore_max_depth: 15     # explore: 시작점에서 몇 걸음 반경까지 볼지

# ── 후보 (한 지점에서 여러 방향을 볼 때) ──────────────────────────────────
candidates:
  # 한 지점에서 물어볼 방향 개수 상한. 정면에 가까운 순으로 정렬한 뒤 자른다.
  #
  # walk 3 / explore 4 로 갈라져 있었고 그 차이에 근거가 없었다. 4 로 합쳤다.
  #
  # ⚠️ 이 값을 "여러 각도로 같은 지점을 확인하는 신뢰도 손잡이"로 쓰지 말 것.
  # 후보 하나하나는 **서로 다른 목적지 pano** 에 대한 별개 질문이지 같은
  # 질문의 반복이 아니다. 다중 화각 다수결은 실측으로 반증됐다 — 3방향 이상
  # 찍힌 pano 12개에서 12개 전부 정답이 뒤집혔다 (docs/23-open-questions.md §5).
  max_candidates: 4

  # 후보를 전부 물을 것인가, 첫 성공에서 멈출 것인가.
  #
  # 근거가 비용이다. 후보는 온 길을 뺀 실제 이웃이라 직선 구간에서는 개수가
  # 1이다 — 전부 물어도 1호출이고, 개수가 2 이상인 곳은 진짜 갈림길이라
  # 어차피 알아야 한다. 즉 늘어나야 할 곳에서만 늘어난다. 그래서 기본이 전부다.
  probe_all: true

  # (walk 전용) 어느 방향도 산책로가 아닌 스텝을 몇 번 참을지.
  # 나무 그늘이나 역광 한 장 때문에 멀쩡한 길을 포기하는 일이 실제로 있다.
  #
  # ⚠️ 비교가 `misses > tolerance` 라 실제로는 **3번째 miss 에서** 멈춘다.
  miss_tolerance: 2

  # (explore 전용) "아님" 판정 노드도 확장할 것인가.
  #
  # 처음엔 산책로 갈래만 확장했는데, 차도 pano 에서 시작하는 순간 모든 방향이
  # "아님" 이라 탐색이 2호출 만에 죽었다 — 실측이고, 웹 UI 유저는 길가를 찍기
  # 마련이다. 차도를 다리 삼아 건너면 하천 램프가 나온다.
  #
  # false 는 예전 방식 — 호출이 절약되는 대신 차도에서 시작하면 죽는다.
  expand_non_trail: true

# ── 좌표 ───────────────────────────────────────────────────────────────────
geo:
  # 시작 좌표를 pano 로 스냅할 때 **만** 쓰는 반경(m). 런당 1회다.
  # 이 반경 안에 로드뷰가 없으면 no_coverage 로 끝난다.
  #
  # ⚠️ kakao 의 스냅 검증(providers/kakao.py, `max(r*3, r+50)`)과 물려 있다.
  # 두 항이 같아지는 지점이 정확히 r=25 이고, 그때 임계가 75m 다. 이 값을
  # 25 아래로 내리면 `+50` 항이 지배해 검증이 급격히 느슨해진다
  # (10 으로 내리면 6배까지 허용). 내릴 거면 그 검증식도 같이 볼 것.
  #
  # fixture 는 이 값을 **무시한다** (격자가 항상 pano 를 준다).
  snap_radius_m: 25.0

# ── VLM 서버 (계약은 docs/10-client-guide.md) ─────────────────────────────
vlm:
  url: "http://127.0.0.1:8080/v1/chat/completions"

  # 판정 기준. 세 버전은 세 개의 다른 질문이다 (app/prompts/).
  #   v1 "이 사진에 산책로가 보이는가"      → 차도에서 True (갓길이 프레임에 보임)
  #   v2 "카메라가 산책로 위에 서 있는가"   → 폭·노면 조건이 청계천을 거부
  #   v3 v2 에서 폭·노면 조건 제거          → 눈으로 확인한 7건 전부 적중
  prompt_version: system_v3

  # 출력 스키마. decode 가 ~37ms/token 이라 **필드 하나가 곧 지연**이다.
  #   walk = is_trail 만 (17토큰 / 620ms) — 탐색 루프용
  #   eval = + confidence 0~10 (26토큰) — ROC 용. 현재 전부 10 으로 포화 상태다
  schema: walk

  # 출력 상한. walk 스키마 실측 17토큰의 3배 이상 여유다
  max_tokens: 60

  # HTTP 타임아웃(초). 콜드 스타트가 ~13초까지 간다
  timeout_s: 180

  # 500 이 이만큼 연속되면 Metal OOM 좀비로 보고 멈춘다. 자체 복구되지 않고
  # /health 는 200 을 주므로 재시도가 무의미하다 — 서버 재시작이 유일한 해결책
  fatal_500_streak: 3

# ── 이미지 (서버로 나가는 바이트의 유일한 출구) ───────────────────────────
image:
  # 16:9 고정. 긴 변이 서버 리사이즈 목표(1056)보다 커서 서버가 다운스케일한다
  # → 입력 크기와 무관하게 이미지 토큰이 264 로 상수가 된다.
  #
  # ⚠️ **이 값이 화각까지 정한다.** kakao 뷰포트가 이 크기를 그대로 쓰고,
  # Kakao 는 세로 화각을 ~59.5°(zoom 0)로 고정한 채 가로를 종횡비에서
  # 파생시키므로 1280×720 에서 가로 90.9° 가 나온다 (실측 → check_fov.py).
  # 즉 지금의 화각은 토큰 예산 결정의 부산물이다. 바꾸면 화각과 토큰 수가
  # **같이** 움직인다. 한쪽만 튜닝할 수 없다.
  target_size: [1280, 720]

  # 위 크기에서 서버가 실제로 매기는 이미지 토큰 수 (실측).
  # min_prompt_tokens 가 여기서 파생된다 — 이 값이 그냥 문서용으로 놀지 않게.
  expected_image_tokens: 264

  jpeg_quality: 90   # 근거 없음. 눈으로 보고 정한 값이다

# ── provider: kakao ───────────────────────────────────────────────────────
kakao:
  # 앱키가 도메인 등록제라 file:// 로는 SDK 가 거부한다. 이 origin 을 콘솔의
  # 플랫폼 > Web > 사이트 도메인에 등록해야 한다.
  # ⚠️ 127.0.0.1 과 localhost 는 **다른 도메인**으로 취급된다.
  host: "127.0.0.1"
  port: 8731

  # 방향 화살표(_al_, _atl_)를 지울지. 기본은 남긴다 — 저건 UI 노이즈가 아니라
  # "여기서 어디로 갈 수 있는가" 라는 정보다. check_fov.py 만 켠다
  # (화살표는 세상이 아니라 화면에 붙어 있어서 화각 측정의 상관관계를 망친다).
  hide_arrows: false

  # 프레임 안정화. 조건이 **둘**이다: 타일 요청이 끊기고, 그다음 연속 N 프레임이
  # 동일할 것. 하나만으로는 반쯤 로드된 그림이 통과한다 — 같은 pano 를 5번
  # 찍었더니 PNG 가 4가지로 나왔고 그중 1회는 판정까지 뒤집혔다. 전부 "안정"
  # 판정을 통과한 채로.
  tile_quiet_ms: 250         # 타일 요청이 이만큼 없으면 로딩이 끝난 것으로 본다
  tile_wait_max_ms: 5000     # 그래도 안 끊기면 포기하고 프레임 비교로 넘어간다
  render_settle_ms: 120      # 프레임 비교 간격
  render_settle_stable: 3    # 연속 몇 프레임이 같아야 안정으로 볼지 (2 로는 부족했다)
  render_settle_tries: 12    # 소진되면 render_unsettled 이벤트. 잦으면 위 값들을 올릴 것

# ── provider: fixture ─────────────────────────────────────────────────────
fixture:
  # 가짜 pano 격자 간격(m) = 보폭이자 이웃 간 거리. 격자가 곧 이웃 그래프다
  grid_m: 10.0

  # null 이면 레포 루트의 bench/images
  images_dir: null
