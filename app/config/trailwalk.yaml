# trailwalk 설정 — app/ 의 기본값은 전부 여기 하나에 있다.
#
# 규칙 (→ CLAUDE.md):
#
#   1. 기본값을 코드에 적지 않는다. dataclass 필드도, 모듈 상수도,
#      argparse 의 default= 도 아니다. 전부 이 파일이다.
#   2. CLI 는 `--config <경로>` 하나만 받는다. 런을 재현하려면 이 파일
#      하나만 있으면 된다.
#   3. 값 옆에 **왜 그 값인가**를 적는다. 근거를 못 적겠으면 그건
#      정해진 값이 아니라 아직 안 정한 값이다 — 그렇게 적어 둔다.
#
# 왜 모았나: 같은 개념이 dataclass·CLI·모듈 상수 세 곳에 흩어져 있었고,
# 값이 서로 어긋났다 (max_candidates 가 walk 3 / explore 4, max_turn_deg 가
# walk 120 / explore 180, expand_non_trail 은 CLI 로 되돌릴 수단이 아예 없었다).
# 어느 것이 실제로 먹는 값인지 코드를 다 읽어야 알 수 있는 상태였다.

# ── 이 런이 무엇인가 ───────────────────────────────────────────────────────
run:
  # kakao = Playwright 로 실제 로드뷰를 몬다 (앱키·브라우저 필요)
  # fixture = 로컬 이미지 + 10m 격자. 오프라인 배선 검증과 회귀 테스트용
  provider: fixture

  # 탐색 시작 좌표 [위도, 경도]. 이 값만 pano 로 스냅되고, 이후 이동은
  # 전부 이웃 그래프다 (좌표를 밀어 만드는 자리는 없다)
  start: [37.5697109, 127.0063616]   # 청계천 보행로

  # 시작 방위 (0=북). 시작 노드는 이웃을 **전부** 물으므로 이 값은
  # 어느 쪽을 먼저 물을지(정렬)만 정한다. 예산이 모자랄 때만 결과가 갈린다
  bearing: 0.0

  # null 이면 app/runs/<UTC시각>-<provider>[-explore].jsonl
  out: null

  # (explore 전용) nodes/probes/frontier 를 JSON 으로 덤프할 경로.
  # eval/plot_explore.py 의 입력이다. null 이면 안 쓴다
  dump: null

  # probe 이미지를 남겨 판정을 눈으로 감사한다. 기본이 꺼진 이유는 성능이
  # 아니라 지도 사업자 약관상 이미지 캐싱이 회색지대이기 때문이다
  save_images: false

  # 브라우저를 띄워서 본다. 캡처가 검게 나오면 첫 번째 의심 대상이다
  headed: false

  # 콜드 스타트(유휴 뒤 첫 요청 ~12초)를 측정 밖으로 빼는 사전 1회 호출
  warmup: false

# ── 예산 ───────────────────────────────────────────────────────────────────
#
# 예산 축은 **둘뿐이다: 경과 시간과 시작점에서의 거리.**
#
# 한때 호출 수(max_vlm_calls)와 걸음 수(max_depth)도 예산이었다. 넷을 두면
# 어느 것이 실제로 끊었는지가 런마다 달라져서, 결과를 읽을 때 "여기까지가
# 지도인가 예산인가" 를 매번 되짚어야 했다. 지금은 사용자가 반경을 정하고,
# 시간은 그 반경을 도는 데 걸리는 시간의 안전망이다.
budget:
  # 벽시계(초). VLM 호출뿐 아니라 **캡처 대기까지** 포함한 안전망이다.
  # 캡처 1건 최악이 ~6.4초(타일 5s + 프레임 안정화 1.44s)라 여기가 커진다.
  #
  # 반경이 먼저 걸리는 것이 정상이고 이 값은 캡처가 병적으로 느릴 때만
  # 걸린다. 3600s ÷ 2.2s ≈ 1,600판정 규모다.
  #
  # 1800 이었다가 3600 으로 올렸다 (2026-08-23): 반경 500m 를 실제로 소진하는
  # 데 1800s 로는 모자랐다. GS25(청계천로 341) 반경 500m 안에 pano 가
  # 2,493개인데 1000장 캡처에 2,213초가 들었고 그때 도달 거리가 398m 였다.
  # 반경이 끊어야 할 자리를 시간이 끊으면 "여기까지가 지도인가 예산인가" 가
  # 다시 모호해진다 — 아래 주석이 막으려던 바로 그 상태다.
  max_seconds: 3600.0

  # 시작점에서의 **직선거리** 상한(m). 이 밖의 노드는 마킹만 하고 확장하지
  # 않는다 — 저 너머는 안 본 것이지 없는 것이 아니라서 frontier 에 남는다.
  #
  # 걸음 수(depth)가 아니라 미터로 재는 이유: pano 간격이 6.4~16.0m 로 두 배
  # 넘게 흔들려서 같은 depth 라도 실제 반경이 코스마다 다르다. 웹 UI 는
  # "여기서 반경 N m" 를 사용자에게 보여줄 것이므로 미터가 계약에 맞다.
  #
  # 누적 이동거리가 아니라 직선거리다. 되돌아오는 갈래가 예산을 먹지 않는다.
  #
  # ⚠️ 기준점은 요청 좌표가 아니라 **스냅된 시작 pano** 다. 웹이 그리는 원의
  # 중심(사용자가 찍은 점)과 최대 snap_radius_m(25m)만큼 어긋날 수 있다.
  # 요청 좌표 기준으로 하면 스냅이 튄 만큼을 아무것도 안 하고 까먹는다.
  #
  # ⚠️ fixture provider 는 10m 격자 이웃을 **무한히** 주므로 반경을 크게
  # 잡으면 노드가 반경 제곱으로 늘어난다 (1000m ≈ 3만 노드). 그때 실제로
  # 런을 끝내는 것은 이 값이 아니라 max_seconds 다.
  # 0 이면 시작 노드만 확장되고 이웃이 전부 즉시 frontier 로 빠진다.
  max_distance_m: 1000.0

# ── 후보 (한 지점에서 여러 방향을 볼 때) ──────────────────────────────────
candidates:
  # 한 지점에서 물어볼 방향 개수 상한. 정면에 가까운 순으로 정렬한 뒤 자른다.
  #
  # ⚠️ 이 값을 "여러 각도로 같은 지점을 확인하는 신뢰도 손잡이"로 쓰지 말 것.
  # 후보 하나하나는 **서로 다른 목적지 pano** 에 대한 별개 질문이지 같은
  # 질문의 반복이 아니다. 다중 화각 다수결은 실측으로 반증됐다 — 3방향 이상
  # 찍힌 pano 12개에서 12개 전부 정답이 뒤집혔다 (app/docs/23-open-questions.md §6).
  max_candidates: 12

# ── 노드 건너뛰기 (판정을 성글게 받는다) ──────────────────────────────────
#
# `run_steps` 개 노드를 찍고 `skip_steps` 개를 건너뛰기를 반복한다.
# 건너뛴 노드도 **이웃은 묻고 확장한다** — 빠지는 것은 캡처와 판정뿐이라
# 밟는 그래프의 모양은 이 값과 무관하다.
#
# ⚠️ **예산 축이 아니다.** 런을 멈추는 것은 여전히 budget 의 둘(시간·거리)이다.
# 한때 있던 max_views 와 성격이 다르다 — 그건 "몇 장 모으면 그만둔다" 라
# 반경을 다 안 돌고 끝났고, 그래서 지웠다 (→ collect 구획 주석).
# 이건 반경을 똑같이 다 돌되 노드 하나의 비용을 낮춘다.
#
# 왜 싼가 (2026-08-23 약수역사거리 실측):
#   노드 하나 = 이웃 0.10s + 캡처 1.18s × 후보수.  건너뛰면 0.10s 만 든다.
#   1찍고4건너뛰기면 노드 하나당 평균 2.07s → 0.49s 다.
skip:
  # 연속으로 찍을 노드 수. 1 이상이어야 한다 (0 이면 갈림길 말고는 아무것도
  # 안 찍는 런이 조용히 돈다 — from_settings 가 터뜨린다).
  run_steps: 1

  # 그다음 건너뛸 노드 수. **0 이면 건너뛰지 않는다** (전부 찍는 옛 동작).
  #
  # ⚠️ 대가는 지면 커버리지다. pano 간격이 ~10m 이고 노면을 판별할 수 있는
  # 거리가 4~20m 라(화각 실측 90.9°/59.5° + 카메라 높이 ~2.2m 가정에서 유도,
  # → docs/23-open-questions.md §3), 4 로 두면 표본 간격이 ~50m 가 되어
  # **안 본 지면이 생긴다.** 시야가 이어주지 못하는 구간이다.
  #
  # 그래서 4 는 "정확도를 재는 값" 이 아니라 **아직 안 정한 값**이다. 대략적
  # 마킹이나 커버리지 조사처럼 판정이 빽빽할 필요가 없는 용도로 골랐고,
  # 얼마나 성글어도 되는지는 라벨 세트로 재 봐야 안다 (→ run_eval).
  # 정확도를 재는 런에서는 0 으로 둘 것.
  skip_steps: 4

  # 갈림길(갈래 ≥ 2)에서는 주기와 무관하게 **전부 찍는다.** 손잡이가 없다 —
  # 끄면 "갈림길은 본다" 가 정책이 아니게 되고, 끈 런과 안 끈 런을 비교할 수
  # 없다 (expand_non_trail 을 지운 것과 같은 이유). 갈림길은 주기도 리셋한다.

# ── 좌표 ───────────────────────────────────────────────────────────────────
geo:
  # 시작 좌표를 pano 로 스냅할 때 **만** 쓰는 반경(m). 런당 1회다.
  # 이 반경 안에 로드뷰가 없으면 no_coverage 로 끝난다.
  #
  # ⚠️ kakao 의 스냅 검증(providers/kakao.py, `max(r*3, r+50)`)과 물려 있다.
  # 두 항이 같아지는 지점이 정확히 r=25 이고, 그때 임계가 75m 다. 이 값을
  # 25 아래로 내리면 `+50` 항이 지배해 검증이 급격히 느슨해진다
  # (10 으로 내리면 6배까지 허용). 내릴 거면 그 검증식도 같이 볼 것.
  #
  # fixture 는 이 값을 **무시한다** (격자가 항상 pano 를 준다).
  snap_radius_m: 25.0

# ── VLM 서버 (계약은 docs/10-client-guide.md) ─────────────────────────────
vlm:
  url: "http://127.0.0.1:8080/v1/chat/completions"

  # 판정 기준. 네 버전은 네 개의 다른 질문이다 (app/prompts/).
  #   v1 "이 사진에 산책로가 보이는가"      → 차도에서 True (갓길이 프레임에 보임)
  #   v2 "카메라가 산책로 위에 서 있는가"   → 폭·노면 조건이 청계천을 거부
  #   v3 v2 에서 폭·노면 조건 제거          → 골목을 전부 True 로 셌다
  #   v4 "카메라 발밑이 무엇인가" (범주)    → 차량 공유 여부를 관찰로 판별
  #
  # v3 를 왜 버렸나: 2026-08-23 약수동 500장에서 True 8건을 눈으로 봤더니
  # 8건 전부 카메라가 차도 위였다. v3 의 "정의된 길이 카메라 아래로 이어지는가"
  # 는 골목이 정확히 만족하는 조건이다 (→ trailwalk/prompt.py 독스트링).
  prompt_version: system_v4

  # 출력 스키마. decode 가 ~37ms/token 이라 **필드 하나가 곧 지연**이다.
  #   walk         = is_trail 만 (17토큰 / 620ms) — v1~v3 탐색 루프용
  #   eval         = + confidence 0~10 (26토큰) — v1~v3 ROC 용
  #   surface      = camera_surface 범주 하나 — v4 탐색 루프용
  #   surface_eval = + confidence — v4 ROC 용
  # 프롬프트 버전과 짝이 맞아야 한다: v4 는 is_trail 을 아예 안 낸다.
  schema: surface

  # ★ 어느 범주를 산책로로 셀 것인가. **프롬프트가 아니라 여기가 경계다.**
  # 경계를 옮겨도 프롬프트 버전이 안 바뀌므로, 이미 받아 둔 camera_surface 를
  # 다시 해석하는 것만으로 A/B 가 된다 (판정을 다시 안 받아도 된다).
  #
  # 지금 값은 라벨 세트(gil.seoul.go.kr 150코스)의 정의에 맞췄다 — 산책하러
  # 가는 곳. 그 세트로만 정확도를 잴 수 있으므로 정의도 거기 맞춘다.
  #
  # 뺀 것 둘, 둘 다 의도적이다:
  #   pedestrian_way — 볼라드로 막힌 벽돌 골목(신당동 곱창골목)이 여기 온다.
  #                    걷기 좋은 길이지만 "산책하러 가는 곳" 은 아니라고 봤다.
  #                    라벨이 생기면 이 줄에 넣었다 뺐다 하며 재면 된다.
  #   sidewalk       — 라벨 코스가 보도로 지나가는 구간(경복궁둘레길 등)이
  #                    전부 False 가 된다. 리포트에서 이건 오탐이 아니라
  #                    정의 차이로 읽어야 한다 (→ docs/22-labels.md §11.3).
  #
  # 쓸 수 있는 값은 trailwalk/prompt.py 의 SURFACES 가 전부다. 오타는 터진다.
  trail_surfaces: [park_path, waterside]

  # 출력 상한. walk 스키마 실측 17토큰의 3배 이상 여유다
  max_tokens: 60

  # HTTP 타임아웃(초). 콜드 스타트가 ~13초까지 간다
  timeout_s: 180

  # 답을 안 받은 채 서버에 띄워 둘 판정 수. **캡처와 VLM 을 겹치는 손잡이다.**
  #
  # 0 이면 옛 동작 — 캡처하고, 답을 기다리고, 다음을 캡처한다. 실측(2026-08-22,
  # 약수역 · 원격 vLLM)에서 판정 하나에 4.47초가 들었고 그 절반씩이 캡처와
  # VLM 이었다. 둘을 겹치면 느린 쪽만 남는다 (같은 100초에 34판정 → 47판정).
  #
  # 크게 두는 이유: **줄을 세우는 것은 서버의 일이다.** 여기서 조이면 큐가
  # vLLM 이 아니라 app 의 스레드풀로 옮겨올 뿐이고, 큐잉·동시성은 app 이
  # 설계하지 않는다 (→ 루트 CLAUDE.md). 실제로 띄워지는 개수는 이 값이 아니라
  # **캡처 속도**가 정한다 — 캡처가 한 번에 하나씩 나오므로 "VLM 지연 ÷ 캡처
  # 간격" 근처에서 저절로 멈춘다. 서버가 `--max-num-seqs 1` 인 지금은 2 언저리다.
  # 서버를 동시 처리로 바꿔도 이 값은 안 고쳐도 된다.
  #
  # ⚠️ 순서와 결과는 이 값과 무관하다. 기록을 FIFO 로만 하므로 probes 와
  # 런로그가 직렬로 돌 때와 같다 (→ explore.py `resolve`).
  #
  # ⚠️ 대가 둘: 시간 예산을 띄워 둔 개수만큼 넘겨서 끊고, 실패를 그만큼 늦게
  # 안다. 그리고 **띄운 것이 쌓이면 timeout_s 가 걸린다** — 서버가 직렬이라
  # 큐 뒤쪽은 앞의 것들을 다 기다린다. 캡처가 VLM 보다 느린 한 안 쌓이지만,
  # 반대가 되면 위 timeout_s 를 같이 봐야 한다.
  max_inflight: 1000

  # 500 이 이만큼 연속되면 Metal OOM 좀비로 보고 멈춘다. 자체 복구되지 않고
  # /health 는 200 을 주므로 재시도가 무의미하다 — 서버 재시작이 유일한 해결책
  fatal_500_streak: 3

# ── 캡처만 모으기 (app/run_collect.py) ──────────────────────────────────
#
# explore 와 **같은 순서로 같은 화각**을 찍되 VLM 에 묻지 않고 파일로만
# 남긴다. 판정값이 탐색을 바꾸지 않으므로(→ explore.py "아님 판정도 확장한다",
# "큐는 하나다") 빼도 도는 경로가 같다.
#
# 왜 나눴나: 실측에서 캡처가 판정 1건의 대부분을 먹고 VLM 은 그 뒤에 숨는다
# (2026-08-22 약수역 런: 2.40s/판정 중 서버 inference 2.10s 가 캡처와 겹쳐
# 사라졌다). 그래서 VLM 만 따로 재려면 캡처를 미리 떠 놓아야 한다 —
# 안 그러면 재는 것이 VLM 이 아니라 Playwright 다.
collect:
  # ⚠️ **장수 상한은 없다.** 한때 max_views 가 있었는데 이것이 위에서 "예산
  # 축은 둘뿐" 이라고 못 박은 원칙을 어긴 세 번째 축이었다. explore 는
  # 시간·거리 둘로만 멈추므로(→ explore.py), 장수로 끊은 collect 결과는
  # explore 가 보냈을 것과 다르다 — 이 스크립트의 존재 이유가 바로 그
  # "같은 것을 모은다" 인데 그것을 스스로 깨고 있었다.
  #
  # 실제로 그 때문에 틀렸다: GS25 반경 500m 수집이 max_views=1000 에서
  # 끊겨 398m 에서 멈췄고, 반경 안 2,493개 pano 중 35.4% 만 밟았다.
  # "500m 를 모았다" 가 아니었다 (2026-08-23).
  #
  # 양을 줄이려면 budget.max_distance_m 을 줄인다. 그러면 무엇이 끊었는지가
  # 결과에 그대로 남는다.

  # 이미지와 대장(views.jsonl)을 둘 폴더.
  # ⚠️ app/runs/images/ 아래여야 gitignore 가 먹는다 — 지도 사업자 약관상
  # 이미지 캐싱이 회색지대라 커밋하지 않는다 (→ docs/23-open-questions.md §2)
  out_dir: "app/runs/images/views"

# ── 이미지 (서버로 나가는 바이트의 유일한 출구) ───────────────────────────
image:
  # 16:9 고정. 긴 변이 서버 리사이즈 목표(1056)보다 커서 서버가 다운스케일한다
  # → 입력 크기와 무관하게 이미지 토큰이 264 로 상수가 된다.
  #
  # ⚠️ **이 값이 화각까지 정한다.** kakao 뷰포트가 이 크기를 그대로 쓰고,
  # Kakao 는 세로 화각을 ~59.5°(zoom 0)로 고정한 채 가로를 종횡비에서
  # 파생시키므로 1280×720 에서 가로 90.9° 가 나온다 (실측 → check_fov.py).
  # 즉 지금의 화각은 토큰 예산 결정의 부산물이다. 바꾸면 화각과 토큰 수가
  # **같이** 움직인다. 한쪽만 튜닝할 수 없다.
  target_size: [1280, 720]

  # 위 크기에서 서버가 실제로 매기는 이미지 토큰 수 (실측).
  # min_prompt_tokens 가 여기서 파생된다 — 이 값이 그냥 문서용으로 놀지 않게.
  expected_image_tokens: 264

  jpeg_quality: 90   # 근거 없음. 눈으로 보고 정한 값이다

# ── provider: kakao ───────────────────────────────────────────────────────
kakao:
  # 앱키가 도메인 등록제라 file:// 로는 SDK 가 거부한다. 이 origin 을 콘솔의
  # 플랫폼 > Web > 사이트 도메인에 등록해야 한다.
  # ⚠️ 127.0.0.1 과 localhost 는 **다른 도메인**으로 취급된다.
  host: "127.0.0.1"
  port: 8731

  # 방향 화살표(_al_, _atl_)를 지울지. 기본은 남긴다 — 저건 UI 노이즈가 아니라
  # "여기서 어디로 갈 수 있는가" 라는 정보다. check_fov.py 만 켠다
  # (화살표는 세상이 아니라 화면에 붙어 있어서 화각 측정의 상관관계를 망친다).
  hide_arrows: false

  # 프레임 안정화. 조건이 **둘**이다: 타일 요청이 끊기고, 그다음 연속 N 프레임이
  # 동일할 것. 하나만으로는 반쯤 로드된 그림이 통과한다 — 같은 pano 를 5번
  # 찍었더니 PNG 가 4가지로 나왔고 그중 1회는 판정까지 뒤집혔다. 전부 "안정"
  # 판정을 통과한 채로.
  tile_quiet_ms: 250         # 타일 요청이 이만큼 없으면 로딩이 끝난 것으로 본다
  tile_wait_max_ms: 5000     # 그래도 안 끊기면 포기하고 프레임 비교로 넘어간다
  render_settle_ms: 120      # 프레임 비교 간격
  render_settle_stable: 3    # 연속 몇 프레임이 같아야 안정으로 볼지 (2 로는 부족했다)
  render_settle_tries: 12    # 소진되면 render_unsettled 이벤트. 잦으면 위 값들을 올릴 것

  # pano 하나가 쓸 수 있게 되기를 기다리는 최대 시간(ms)과 폴링 간격.
  #
  # ⚠️ **두 자리를 함께 정한다.** 낮추면 둘 다 짧아진다:
  #   - `__show` 의 전환 데드라인 — 캡처마다 도는 핫패스다. 넘기면
  #     "pano 로 전환되지 않았다" 로 캡처가 실패한다
  #   - `neighbors()` 의 노드 JSON 대기 — 넘기면 빈 목록을 주고,
  #     호출자는 그것을 neighbors_missing(=이웃을 못 얻었다)으로 읽는다
  # 둘 다 "SDK 가 이 pano 를 받아왔는가" 를 기다리는 것이라 한 값으로 묶었다.
  #
  # 짧게 잡으면 느린 회선에서 **있는 갈래를 없다고 한다.** 같은 그래프가
  # 머신·회선 상태에 따라 다르게 나오면 재현성이 깨진다 — 프레임 안정화
  # (위 render_settle_*)에서 이미 한 번 치른 종류의 사고다.
  #
  # 빠를 때는 비용이 0 이다. 도착하는 즉시 빠져나오고, 2026-08-23 약수역사거리
  # 실측에서 노드 JSON 은 중앙값 ~100ms(=폴링 1회차)에 왔다.
  pano_wait_ms: 12000
  pano_poll_ms: 100

# ── provider: fixture ─────────────────────────────────────────────────────
fixture:
  # 가짜 pano 격자 간격(m) = 보폭이자 이웃 간 거리. 격자가 곧 이웃 그래프다
  grid_m: 10.0

  # null 이면 레포 루트의 bench/images
  images_dir: null

# ── 라벨 샘플링 (app/labels/make_samples.py) ──────────────────────────────
#
# ⚠️ 이 구획은 **양성 전용**이다. 음성 자동 생성(같은 pano 이각·코스 밖 격자)은
# 2026-08-19 에 폐기됐다 — 라벨 단위가 (pano,heading) 이 아니라 pano 이기
# 때문이다. 논거와 그 자리를 무엇이 대신하는지는 docs/22-labels.md §5·§8.
sampling:
  # 폴리라인 리샘플 간격(m). Kakao pano 가 도로에서 ~10~20m 간격이라 50m 면
  # 이웃 샘플이 같은 pano 로 스냅되는 중복이 드물다 (실측 수율 78%).
  interval_m: 50.0

  # 코스마다 **시작 몇 m 까지** 쓸지. 150개 코스 421km 를 전부 찍으면 캡처만
  # 7시간이고, 같은 코스의 인접 50m 점은 거의 같은 장면이라 정보가 안 는다.
  # 코스 수(테마 5종 × 자치구 28곳)가 다양성을 사는 축이다.
  #
  # ⚠️ 알려진 편향: 코스 앞머리는 진입로·주차장·역 출구가 많다. 코스 중반의
  # 전형적인 산책로 장면이 과소 대표된다 → docs/22-labels.md §8 에 기록.
  # 나머지 구간 수집은 TODO.
  head_m: 1000.0

  # 리샘플 점 → pano 스냅 반경(m). geo.snap_radius_m(25, 시작점용)보다 살짝
  # 넓다 — 폴리라인이 길 중앙선이고 로드뷰 촬영차선이 몇 m 비껴 있기 때문.
  # 스냅 결과가 폴리라인에서 이 값의 1.5배를 넘으면 평행한 옆길로 본다.
  snap_radius_m: 30.0

  # 코스당 pano 상한. head_m 컷 뒤에도 남을 수 있는 안전판이다
  # (짧은 간격 + 긴 head_m 조합). 0 이면 상한 없음.
  max_panos_per_course: 0

  # 커버리지 프로브(probe_coverage.py)의 on_route_ratio 가 이 값 미만인 코스는
  # 캡처에서 제외한다. 로드뷰가 코스 위에 없으면 찍어봐야 옆 차도만 나온다 —
  # 숲길·계곡길에서 실제로 그렇다 (docs/22-labels.md §9).
  # coverage.json 이 없으면 이 게이트는 그냥 안 걸린다.
  coverage_min_ratio: 0.5

  # 코스 N개마다 provider(브라우저)를 재시작한다. 수 시간짜리 Playwright
  # 세션의 누수·정체를 잘라내고, 크래시 손실을 N코스로 묶는다.
  # 재시작 비용은 세션 첫 캡처 폐기 ~1.5s 뿐이다. 0 이면 재시작 안 함.
  provider_restart_every: 10

# ── 라벨 데이터셋 ─────────────────────────────────────────────────────────
labels:
  # app/labels/<이름>/ 의 이름. 스크립트의 --dataset 가 이걸 덮는다.
  #   jongno = 종로구 걷기코스 9개 (파일럿, 전 구간)
  #   seoul  = 서울 테마산책길 150개 (시작 head_m 만)
  # 둘을 합치지 않는 이유는 docs/22-labels.md §9.
  dataset: seoul

# ── 평가 러너 (app/run_eval.py) ───────────────────────────────────────────
eval:
  # 검수 확정 라벨 (apply_review.py 산출). run_eval 의 유일한 입력이다.
  labels: "app/labels/jongno/labels.jsonl"

  # null 이면 app/runs/<UTC시각>-eval.jsonl
  out: null

  # out 파일이 이미 있으면 기록된 sample_id 를 건너뛰고 이어 쓴다.
  # 서버가 죽어도(Metal OOM) 재시작 후 같은 명령이 곧 재개다.
  # 재개는 기존 파일의 prompt/labels 지문이 현재 설정과 같을 때만 허용된다.
  resume: true
