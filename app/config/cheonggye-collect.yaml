# 청계천 하천 보행로 캡처 수집 — 산책로 **양성** 표본
#
#     python app/run_collect.py --config app/config/cheonggye-collect.yaml
#
# VLM 서버가 필요 없다. 여기 없는 값은 전부 정본(app/config/trailwalk.yaml)에서 온다.
#
# 왜 모으나: yaksu-1000 은 차도와 골목뿐이라 **음성 전용**이다. v4 가 오탐을
# 8/500 → 0/500 으로 줄인 것은 확인했지만, 그 세트로는 재현율을 못 잰다.
# 이 세트는 반대쪽 — 카메라가 실제로 산책로 위에 서 있는 장면이다.

run:
  provider: kakao

  # ⚠️ **이 좌표는 GS25 청계천패션2점(청계천로 341)이 아니다.** 그 주소에
  # 스냅하면 pano 1198162403 이 잡히는데 shot_tool=202(차량) · st_type=이면도로
  # · 창신동 종로50라길이다 — 청계천로 위도 아니고 골목이다. 거기서 시작하면
  # yaksu-1000 과 같은 것을 한 번 더 모으게 된다.
  #
  # 청계천은 **차도 계열과 보행로 계열이 별도 그래프**라 차도에서 시작하면
  # 하천으로 못 내려간다 (→ docs/23-open-questions.md §7). 그래서 GS25 에서
  # 남동쪽 ~80m 를 훑어 도보 계열을 찾아 그 pano 좌표를 직접 적는다:
  #
  #   pano 1039597110 · shot_tool=100(도보) · 청계천로 주요도로3 · 창신동
  #   눈으로 확인: 하천 바닥 석재 보행로, 좌측에 물, 전방에 보행자 2명
  #
  # 시작점을 옮기면 이 확인을 다시 해야 한다.
  start: [37.569948, 127.016246]

  # 하천 보행로는 동서로 뻗는다. BFS 는 첫 노드에 came_from 이 없어 양쪽을
  # 다 밟으므로 이 값은 첫 화각만 정한다
  bearing: 270.0

  save_images: false       # 이 스크립트는 런로그를 안 쓴다. collect.out_dir 로 나간다

budget:
  # 사용자 요청: GS25 위치에서 500m
  max_distance_m: 500.0

  # 하천 보행로는 **선형**이라 노드마다 갈래가 사실상 1개다 (실측 108 pano
  # → 109장, 노드당 1.01). 격자형 골목과 달리 금방 `exhausted` 로 끝난다 —
  # 그건 실패가 아니다.
  max_seconds: 3600.0

collect:
  out_dir: "app/runs/images/cheonggye-500m"
